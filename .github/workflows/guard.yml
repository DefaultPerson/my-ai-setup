name: guard

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate Python, JSON and TOML
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          for root in (Path('.claude'), Path('.codex')):
              for path in root.rglob('*.py'):
                  compile(path.read_text(), str(path), 'exec')
              for path in root.rglob('*.json'):
                  json.loads(path.read_text())
          tomllib.loads(Path('.codex/config.toml.sample').read_text())
          PY
      - run: diff .claude/hooks/guard.py .codex/hooks/guard.py
