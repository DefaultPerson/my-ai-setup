name: guard

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate Python, JSON and TOML
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          for root in (Path('.claude'), Path('.codex')):
              for path in root.rglob('*.py'):
                  compile(path.read_text(), str(path), 'exec')
              for path in root.rglob('*.json'):
                  json.loads(path.read_text())
          tomllib.loads(Path('.codex/config.toml.sample').read_text())
          PY
      - run: diff .claude/hooks/guard.py .codex/hooks/guard.py
      - name: Validate native skills and shell helpers
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          import yaml

          roots = [Path('.claude/skills'), Path('.codex/skills')]
          for root in roots:
              for path in root.glob('*/SKILL.md'):
                  header, body = path.read_text().split('---', 2)[1:]
                  metadata = yaml.safe_load(header)
                  assert metadata['name'] == path.parent.name, path
                  assert isinstance(metadata['description'], str) and metadata['description'].strip(), path
                  assert body.strip(), path
              for path in root.rglob('*.sh'):
                  subprocess.run(['bash', '-n', str(path)], check=True)
              for path in root.rglob('*.yaml'):
                  yaml.safe_load(path.read_text())

          for name in ('svgl', 'autoresearch', 'verify-done', 'grill-me', 'ui-iterate'):
              bodies = [(root / name / 'SKILL.md').read_text().split('---', 2)[2] for root in roots]
              assert bodies[0] == bodies[1], name
          scripts = [(root / 'svgl/scripts/svgl.sh').read_bytes() for root in roots]
          assert scripts[0] == scripts[1]
          policy = yaml.safe_load(Path('.codex/skills/grill-me/agents/openai.yaml').read_text())
          assert policy['policy']['allow_implicit_invocation'] is False
          PY
